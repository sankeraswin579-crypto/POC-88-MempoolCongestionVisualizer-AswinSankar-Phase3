services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poc88-backend
    environment:
      MEMPOOL_API_URL: ${MEMPOOL_API_URL:-https://mempool.space/api}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-20}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: poc88-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy